# MAX78000FTHR: MAX78000 debugged through the on-board DAPLink (MAX32625)
#
# Requires an OpenOCD providing target/max32xxx_common.cfg (upstream OpenOCD
# since 2025). Flash parameters and reset handling from the MAX78000 target
# file of the Analog Devices OpenOCD fork.

adapter speed 500

# The boot ROM runs after a reset, before the application: the core is reset
# through nRESET and halted with a hardware breakpoint at the end of the ROM.
reset_config srst_only
adapter srst delay 2
adapter srst pulse_width 2

set CHIPNAME max78000

# 512 KiB of flash in 8 KiB pages, flash controller at 0x40029000, 128-bit
# writes
set FLASH_BASE 0x10000000
set FLASH_SIZE 0x80000
set FLC_BASE 0x40029000
set FLASH_SECTOR 0x2000
set FLASH_CLK 100
set FLASH_OPTIONS 0x01

source [find target/max32xxx_common.cfg]

# Address of the last instruction of the boot ROM
set ROM_END_ADDR 0x00002124

global rom_bp_enabled
set rom_bp_enabled "no"

# Override init_reset to know the reset mode in the reset events
proc init_reset {mode} {
    global sp_reset_mode
    set sp_reset_mode $mode
}

$_CHIPNAME.cpu configure -event reset-assert-pre {
    global sp_reset_mode
    global rom_bp_enabled
    global ROM_END_ADDR

    if { ([string compare $sp_reset_mode "halt"] == 0) || ([string compare $sp_reset_mode "init"] == 0) } {
        catch {halt}
        if { [string compare $rom_bp_enabled "yes"] == 0 } {
            rbp $ROM_END_ADDR
        }
        bp $ROM_END_ADDR 2 hw
        set rom_bp_enabled "yes"
    }
}

$_CHIPNAME.cpu configure -event reset-deassert-post {
    global sp_reset_mode
    global _CHIPNAME

    if { [string compare $sp_reset_mode "init"] == 0 } {
        set state "reset"
        while { [string compare $state "reset"] == 0 } {
            set state [$_CHIPNAME.cpu curstate]
            $_CHIPNAME.cpu arp_poll
        }
        $_CHIPNAME.cpu arp_halt
    }
}

$_CHIPNAME.cpu configure -event halted {
    global sp_reset_mode
    global rom_bp_enabled
    global ROM_END_ADDR

    if { [string compare $rom_bp_enabled "yes"] == 0 } {
        rbp $ROM_END_ADDR
        set rom_bp_enabled "no"
    }
    set sp_reset_mode none
}
